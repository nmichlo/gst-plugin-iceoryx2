# ===== BUILD ===== #

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# The GStreamer plugin cdylib is built from the `gst-plugin-iceoryx2` workspace member. It contains
# NO pyo3 — it is a pure GStreamer plugin (so the standard out-of-process gst-plugin-scanner can load
# it). `cffi` bindings just give maturin a way to ship the plain cdylib in the wheel (under
# gst_iceoryx2/_native/); setup_gstreamer() locates the file by path — never importing it, so the
# pure-Python gst_iceoryx2.video SDK still loads with no GStreamer/cffi — and symlinks it as
# libgsticeoryx2.so. The pure-Python wrapper lives under python/.
python-source = "python"
manifest-path = "crates/gst-plugin-iceoryx2/Cargo.toml"
module-name = "gst_iceoryx2._native"
bindings = "cffi"

# ===== PROJECT ===== #

[project]
name = "gst-plugin-iceoryx2"
description = "GStreamer iceoryx2sink/iceoryx2src: move video frames zero-copy through iceoryx2 shared memory"
readme = "README.md"
authors = [{ name = "Nathan Michlo", email = "nathanjmichlo@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
# Version is read from Cargo.toml [package] version by maturin.
dynamic = ["version"]

dependencies = [
    "iceoryx2==0.7.0",   # lockstep with the Rust crate; consumers subscribe with the same version
    "numpy>=1.26",       # lazily imported by the gst_iceoryx2.video SDK (header_pixels_to_numpy)
]

# The GStreamer Python bindings are needed only by setup_gstreamer() (to register the
# compiled plugin with a host GStreamer). The pure-Python `gst_iceoryx2.video` SDK — ctypes
# + iceoryx2 + numpy — never touches GStreamer, so consumers that only subscribe install lean:
#   pip install gst-plugin-iceoryx2          # SDK only (no GStreamer)
#   pip install gst-plugin-iceoryx2[gst]     # + setup_gstreamer() / the plugin elements
[project.optional-dependencies]
gst = [
    "PyGObject>=3.50",   # gi / GStreamer Python bindings used by setup_gstreamer()
]

[project.urls]
Homepage = "https://github.com/nmichlo/gst-plugin-iceoryx2"
Repository = "https://github.com/nmichlo/gst-plugin-iceoryx2"
Issues = "https://github.com/nmichlo/gst-plugin-iceoryx2/issues"

# developer-only dependencies (not published)
#   developers use: `uv sync --dev`
[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "cffi>=1.16",        # build-time only: maturin's cffi binding ships the plugin cdylib in the wheel
    "pytest>=8.0",
    "pre-commit>=4.0",
    "ruff>=0.6",
    "dunamai>=1.21",     # git → PEP 440 version for scripts/version.py (the SCM-versioning stamp)
]

# GStreamer Python bindings — needed only by setup_gstreamer() and the integration tests (the
# elements). Kept out of `dev` so `uv sync --dev` (unit tests + the version script) never builds it.
# Pinned <3.52 so it builds against girepository-1.0 (PyGObject 3.52 switched to girepository-2.0);
# the published `[gst]` extra above stays unpinned for end users on newer systems.
#   developers use: `uv sync --dev --group gst`
gst = [
    "PyGObject>=3.50,<3.52",
]

# benchmark-only dependencies (transport comparison harness under benchmarks/)
#   developers use: `uv sync --group benchmark`
benchmark = [
    "redis>=5.0",        # the Redis transport comparison
    "psutil>=5.9",       # producer CPU sampling
]

# ===== PYTEST ===== #

[tool.pytest.ini_options]
# Unmarked tests are fast unit tests (no IPC, no GStreamer pipeline).
#   - integration: needs a real GStreamer pipeline + iceoryx2 shared memory (run in a container)
markers = [
    "integration: requires a running GStreamer pipeline and iceoryx2 shared memory",
]
testpaths = ["python/gst_iceoryx2_tests"]
addopts = ["--strict-markers", "--strict-config", "--tb=short", "-v"]

# ===== RUFF ===== #

[tool.ruff]
line-length = 100
# maturin's cffi binding generates this wrapper package into the source tree at build time.
extend-exclude = ["python/gst_iceoryx2/_native"]

[tool.ruff.lint]
extend-select = ["I"]   # import sorting
