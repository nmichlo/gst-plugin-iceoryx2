# Cargo workspace: a GStreamer-free core SDK crate (`gst-plugin-iceoryx2-video`) and the GStreamer
# plugin (`gst-plugin-iceoryx2`) that builds on it. Both share one version (stamped from git by
# scripts/version.py into `[workspace.package] version`) and the dependency pins below.
[workspace]
resolver = "2"
members = [
    "crates/gst-plugin-iceoryx2-video",
    "crates/gst-plugin-iceoryx2",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/nmichlo/gst-plugin-iceoryx2"

[workspace.dependencies]
# Internal: the plugin depends on the core SDK crate. `version` + `path` so the same dependency
# resolves locally during development and against crates.io once published. scripts/version.py stamps
# this version alongside `[workspace.package] version` so the two always match at publish time.
gst-plugin-iceoryx2-video = { version = "=0.0.2", path = "crates/gst-plugin-iceoryx2-video" }
# Lockstep with the Python `iceoryx2==0.9.1` binding the consumer uses. iceoryx2 has NO cross-version
# wire/ABI compatibility (it rejects mismatched peers via a shared-memory PackageVersion check), so the
# Rust crate and the Python binding MUST be the exact same version — see SPEC.md.
iceoryx2 = "=0.9.1"
# Optional, core-crate only: the opt-in `(H, W, C)` reshape helpers (parity with the Python numpy
# path). Pulled in solely by the core crate's `ndarray` feature, so the default build never links it.
ndarray = "0.16"
# `v1_24` unlocks GstMeta serialize/deserialize (gst_meta_serialize, 1.24+) used by the aux blob for
# arbitrary-meta passthrough — so the wheel requires a GStreamer 1.24+ runtime.
gst = { package = "gstreamer", version = "0.23", features = ["v1_24"] }
gst-base = { package = "gstreamer-base", version = "0.23", features = ["v1_24"] }
gst-video = { package = "gstreamer-video", version = "0.23", features = ["v1_24"] }

[profile.release]
# Smaller, faster-to-load plugin.
lto = "thin"
codegen-units = 1
