# Release workflow — build a PyPI-ready wheel matrix + sdist on a version tag, attach them to a
# GitHub Release, and (optionally) publish to PyPI via trusted publishing.
#
# Trigger: merge a PR with #major/#minor/#patch in its title (or push a `vX.Y.Z` tag by hand). The
# shared `nmichlo/.github/actions/version-bump` turns the keyword into a tag, the same as every other
# repo; #none releases nothing. It runs on `push` rather than a closed PR because a PR from a fork gets
# a read-only token, so its merge could never push the tag.
#
# Versioning: the tag is the only version. Cargo.toml holds a 0.0.0 placeholder, and every job that
# builds or publishes stamps the tag's version into it first (`actions/stamp-cargo-version`) —
# maturin reads it for the wheel/sdist, and both crates inherit it. Nothing is committed back.
#
# Why the wheels are NOT self-contained: the plugin cdylib links the *system* GStreamer (1.24+) and
# shares it in-process with PyGObject, so bundling GStreamer would double-load libgstreamer and crash.
# The Linux wheel is therefore repaired with `auditwheel --exclude` for the GStreamer/GLib libraries
# (kept as runtime `NEEDED`, resolved from the host); macOS leaves the Homebrew references in place.
# Consequence: the wheel requires a host GStreamer 1.24+. The Linux glibc floor (set by the build
# runner) lines up with where GStreamer 1.24 ships anyway, so this is not an extra restriction in
# practice. The pure-Python `gst_iceoryx2.video` SDK needs none of this — it never loads the plugin
# cdylib (setup_gstreamer only locates it by path), so the GStreamer references are never reached.
name: release

on:
  push: {branches: [main], tags: ['v*.*.*']}

permissions:
  contents: read

jobs:
  # ---- The tag this run releases: a new one on a merge that asks for it, the pushed one on a tag
  #      push, empty otherwise. Tags pushed with GITHUB_TOKEN do not trigger other workflows, which is
  #      why the builds below live in this same run.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        uses: nmichlo/.github/actions/version-bump@main

  # ---- Linux: build on ubuntu-latest (glibc + GStreamer 1.24), repair to manylinux excluding GStreamer
  linux-wheel:
    name: Build Linux wheel
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Install GStreamer 1.24 dev + repair tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libclang-dev patchelf

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: '3.12'   # one wheel covers CPython 3.12+ (the plugin is dlopened, not a Python ext)
      - uses: dtolnay/rust-toolchain@stable
      # enable-cache: false -- a release build should resolve everything from
      # scratch. setup-uv caches by default, and its key is not scoped per
      # workflow, so a release would otherwise read whatever test.yaml last
      # wrote. Nothing can reach that cache today (this file has no
      # pull_request trigger), but a cold release build costs under a minute
      # and removes the need to keep proving it.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # `python3.12` on PATH is uv's managed interpreter, which ships no pip, so
      # maturin's own `pip install cffi` fallback dies with "No module named
      # pip". Both this step and `-i` below use setup-python's exact path, so
      # they cannot disagree about which interpreter is being built for.
      - name: Install cffi for the build interpreter (maturin's cffi binding ships the plugin cdylib)
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          "${PYTHON}" -m pip install cffi

      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build wheel (warn-only audit — we repair manually with excludes next)
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: uvx maturin build --release --auditwheel warn -i "${PYTHON}" --out dist-raw

      - name: Repair → manylinux, excluding system GStreamer/GLib (used from the host at runtime)
        run: |
          uvx --from auditwheel auditwheel repair dist-raw/*.whl -w dist \
            --exclude 'libgstreamer-1.0.so.0' \
            --exclude 'libgstbase-1.0.so.0' \
            --exclude 'libgstvideo-1.0.so.0' \
            --exclude 'libglib-2.0.so.0' \
            --exclude 'libgobject-2.0.so.0' \
            --exclude 'libgmodule-2.0.so.0' \
            --exclude 'libgthread-2.0.so.0'
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*.whl

  # ---- macOS: maturin does not bundle external dylibs, so the wheel references the Homebrew
  #      GStreamer (resolved at dlopen time by setup_gstreamer); nothing to exclude. Apple Silicon
  #      only: Intel Macs install from the sdist.
  macos-wheel:
    name: Build macOS wheel (arm64)
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Install GStreamer (Homebrew)
        run: brew install gstreamer

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      # enable-cache: false -- a release build should resolve everything from
      # scratch. setup-uv caches by default, and its key is not scoped per
      # workflow, so a release would otherwise read whatever test.yaml last
      # wrote. Nothing can reach that cache today (this file has no
      # pull_request trigger), but a cold release build costs under a minute
      # and removes the need to keep proving it.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # `python3.12` on PATH is uv's managed interpreter, which ships no pip, so
      # maturin's own `pip install cffi` fallback dies with "No module named
      # pip". Both this step and `-i` below use setup-python's exact path, so
      # they cannot disagree about which interpreter is being built for.
      - name: Install cffi for the build interpreter (maturin's cffi binding ships the plugin cdylib)
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          "${PYTHON}" -m pip install cffi

      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build wheel
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: uvx maturin build --release -i "${PYTHON}" --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist/*.whl

  # ---- Source distribution (the build-from-source fallback; needs GStreamer 1.24 dev + Rust to build)
  sdist:
    name: Build sdist
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.version }}
      # enable-cache: false -- a release build should resolve everything from
      # scratch. setup-uv caches by default, and its key is not scoped per
      # workflow, so a release would otherwise read whatever test.yaml last
      # wrote. Nothing can reach that cache today (this file has no
      # pull_request trigger), but a cold release build costs under a minute
      # and removes the need to keep proving it.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}
      - name: Build sdist
        run: uvx maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # ---- Attach all artifacts to a GitHub Release. Runs only after the PyPI + crates.io
  #      publishes succeed, so a Release never appears for a version that failed to publish.
  github-release:
    name: Create GitHub Release
    needs: [version, linux-wheel, macos-wheel, sdist, pypi-publish, rust-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release with wheels + sdist
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  # ---- Publish to PyPI via trusted publishing.
  #      One-time setup required: create the project on PyPI, add a Trusted Publisher for this repo +
  #      workflow, and create a `pypi` GitHub environment (optionally with required reviewers). Point
  #      `repository-url` at https://test.pypi.org/legacy/ first to rehearse on TestPyPI.
  pypi-publish:
    name: Publish to PyPI
    needs: [linux-wheel, macos-wheel, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gst-plugin-iceoryx2
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ---- Publish both workspace crates to crates.io via trusted publishing.
  #      One-time setup required: register `gst-plugin-iceoryx2-video` and `gst-plugin-iceoryx2` on
  #      crates.io, add a Trusted Publisher for this repo + workflow to each, and create a `release`
  #      GitHub environment. The core crate is published first (the plugin depends on it with an exact
  #      `=X.Y.Z` pin); `cargo publish` waits for the new version to be indexed before returning, so
  #      the subsequent plugin publish can resolve it. Only the plugin's verification build links the
  #      system GStreamer — hence the dev-headers install (harmless for the core crate).
  rust-publish:
    name: Publish to crates.io
    needs: [version, linux-wheel, macos-wheel, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # OIDC for crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.version }}
      - name: Install GStreamer 1.24 dev (the plugin's verification build links system GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      # no --allow-dirty needed below: the stamp only touches the workspace root, which is outside
      # both published crates.
      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.version.outputs.version }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish core crate, then the plugin (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p gst-plugin-iceoryx2-video
          cargo publish -p gst-plugin-iceoryx2
