# runs `.pre-commit-config.yaml` verbatim, so `pre-commit run --all-files`
# locally and CI can never disagree. tool config lives in `pyproject.toml`.

name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    uses: nmichlo/.github/.github/workflows/pre-commit.yaml@main
    with:
      # cargo fmt/clippy need the GStreamer dev headers to compile, which this
      # job does not install -- they run in `test.yaml` instead, where it does.
      skip-hooks: "cargo-fmt,cargo-clippy"
      # no hook imports the package
      install: false
