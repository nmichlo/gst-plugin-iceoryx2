name: test
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  # Fast gate (no GStreamer / no compile): `cargo metadata --locked` fails if Cargo.lock no longer
  # matches Cargo.toml (a dependency changed but the lockfile wasn't regenerated).
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo.lock is in sync with Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Exercise the abi3 floor (3.12, the package's requires-python) plus a current interpreter.
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Install GStreamer + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gobject-introspection \
            libgirepository1.0-dev \
            libcairo2-dev \
            libclang-dev

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps + build extension
        run: |
          uv sync --dev --group gst
          uv run maturin develop --uv

      - name: Rust tests + lint
        run: |
          cargo test
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Python unit tests
        run: uv run pytest -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GStreamer (+ videotestsrc) + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gobject-introspection \
            libgirepository1.0-dev \
            libcairo2-dev \
            libclang-dev

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps + build extension
        run: |
          uv sync --dev --group gst
          uv run maturin develop --uv

      - name: Rust SDK round-trip (iceoryx2 IPC) + Python integration tests
        # iceoryx2 maps POSIX shared memory; raise the memlock limit for the run. The Rust SDK
        # round-trip is #[ignore] (needs the IPC runtime), so run it explicitly with --ignored.
        run: |
          sudo prlimit --pid $$ --memlock=-1:-1 || true
          cargo test -p gst-plugin-iceoryx2-video -- --ignored
          uv run pytest -m integration -v

  # The branch-protection gate; see nmichlo/.github/actions/gate for why it
  # exists. `always()` is required, or the gate is skipped when what it guards
  # fails -- and a skipped required check counts as success.
  test:
    needs: [lockfile, unit-tests, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: nmichlo/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
