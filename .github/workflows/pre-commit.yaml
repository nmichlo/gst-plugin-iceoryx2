name: pre-commit
on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pre-commit/action@v3.0.1
        env:
          # The Rust hooks (cargo fmt/clippy) need the GStreamer dev headers to compile; they run
          # in the `pytest` workflow's "Rust tests + lint" step instead, so skip them here.
          SKIP: cargo-fmt,cargo-clippy
